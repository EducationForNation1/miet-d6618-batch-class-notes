{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}
<div class="auth-box"><h1>Welcome Back</h1><p class="muted center">Login with email or username</p>
<form id="loginForm" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Email or Username</label><input id="identifier" name="identifier"><small id="identifierError" class="error"></small></div>
<div class="form-group"><label>Password</label><div class="password-row"><input id="password" name="password" type="password"><button class="toggle-password" data-target="password" type="button">Show</button></div><small id="passwordError" class="error"></small></div>
<div class="check-row"><input id="remember" name="remember" type="checkbox"><label for="remember">Remember Me</label></div>
<button class="btn full" type="submit">Login</button></form>
<div class="link-stack"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a><a href="{{ url_for('resend_verification') }}">Resend Verification Email</a><a href="{{ url_for('register') }}">Create Account</a></div></div>{% endblock %}
