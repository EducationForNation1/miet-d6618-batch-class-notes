<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-Form</title>
</head>
<body>
    <div class="container">
        <form onsubmit="myForm(); return false;" name="profile">
            <input type="text" name="nm"  placeholder="Enter Name"> <br><br>
            <input type="text" name="age" placeholder="Enter Age"> <br><br>
            <input type="email" name="email" placeholder="Enter Email"> <br><br>
            <input type="submit"  value="Profile">
        </form>
    </div>
<hr>

<div class="profile_container">
    <h2>Name : <span id="name"></span></h2>
    <h2>Age : <span id="age"></span></h2>
    <h2>Email : <span id="email"></span></h2>
</div>


<script src="./script.js"></script>
</body>
</html>
