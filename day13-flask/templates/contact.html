{% extends './base.html' %} {% block title %} Contact {% endblock %} {% block
content %}
<div class="container">
  <div class="row">
    <div class="col">
      <div class="container mt-5" style="margin-top:100px !important; ">
        <img src="{{ url_for('static', filename='images/contact.jpg') }}" class="w-100 mt-5 rounded" alt="">
      </div>
    </div>
    <div class="col">
     <div class="container mt-5">
        <h3 class="text-center">Contact Here</h3>
        <p class="text-center">Our team will connect you as soon as posible</p>
         <form>
        <div class="mb-3">
          <label for="full_name" class="form-label"
            >Full Name</label
          >
          <input
            type="text"
            class="form-control"
            id="full_name"
          />

          
        </div>

        <div class="mb-3">
          <label for="emial" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
          />
        </div>


         <div class="mb-3">
          <label for="phone" class="form-label">Phone No.</label>
          <input
            type="text"
            class="form-control"
            id="phone"
          />
        </div>


         <div class="mb-3">
          <label for="msg" class="form-label">Message </label>
          <textarea class="form-control" id="msg" rows="3"></textarea>
        </div>

       
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
     </div>
    </div>
  </div>
</div>
{% endblock %}
